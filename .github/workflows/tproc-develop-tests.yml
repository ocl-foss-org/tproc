name: Ne.app TProc CI + Tests + BJam Test (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build CI OCL
      run: sudo cmake -B build -DINSTALL_OCL=1
    - name: Install B2 for Ubuntu
      run: cd bjam-src && ./build.sh
    